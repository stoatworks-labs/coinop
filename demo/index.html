  <body>
    <main id="demo">
      <noscript>
        <h1>Coinop</h1>
        <p>
          Snake, Bricks, Marchers, Rally, Drift, Stacker, Chase, Girders, Swarm,
          Trails, Reflex, Rafters, Duel and Flapper, as an FFGL source and a
          matching effect for Resolume. Play them from a MIDI pad or an OSC
          fader, or leave the autopilot to play and lose on its own. In the
          effect the brick field is made out of the clip, so breaking a brick
          punches a hole through to the layer below.
        </p>
        <p>
          This demo runs the plugin's shaders in your browser, so it needs
          JavaScript and WebGL2. The plugin itself, its source and its downloads
          are on
          <a href="https://stoatworks-labs.com/software/coinop/">its project page</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/coinop/">Project page and downloads</a></li>

          <li><a href="https://github.com/stoatworks-labs/coinop">Source on GitHub</a></li>
        </ul>
      </noscript>
