name: release

# Build both Coinop plugins for the two platforms Resolume runs on:
#   - macOS   -> universal (arm64 + x86_64) Coinop.bundle + "Coinop Over.bundle"
#   - Windows -> x64 Coinop.dll + "Coinop Over.dll" (GLEW static via vcpkg)
#
# Two artefacts per platform and not one, because FFGL resolves a single plugMain
# per binary: a source and an effect are two bundles, not one bundle with two
# entries. Both go in the same zip -- an operator wants the pair.
#
# **There is deliberately no OpenFX build here**, unlike the rest of the plugin
# fleet. OFX hosts render on scrub: Resolve asks for frame 500, then frame 12,
# then 500 again. A stateful simulation cannot answer that -- there is no closed
# form for "where is the snake at frame 500" that does not involve having played
# the first 499. Every other plugin in the fleet is a pure function of its
# parameters and ports for free; this one is not, and shipping an OFX build that
# scrubbed incoherently would be worse than not shipping one.
#
# Trigger manually (Actions > release > Run workflow) or by pushing a v* tag.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-universal, os: macos-14 }
          - { name: windows-x86_64,  os: windows-latest }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # --- macOS: no extra deps, universal build straight from CMake ---
      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCOINOP_BUILD_TOOLS=OFF

      # --- Windows: GLEW comes from vcpkg, static-linked (static-md keeps the
      #     CRT dynamic so the plugin matches the host) so the .dll has no
      #     external glew32.dll runtime dependency. ---
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: >
          cmake -B build -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DCOINOP_BUILD_TOOLS=OFF
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel

      # The simulation has to keep linking with no graphics API and no host SDK
      # present. It is the property the whole test strategy rests on, and it can
      # only rot silently -- one #include is all it takes -- so it is checked on
      # every release rather than trusted.
      - name: Simulation stays GL-free
        if: runner.os == 'macOS'
        run: |
          cmake -B build-simonly -DCOINOP_BUILD_PLUGINS=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build-simonly --target coinop_sim --parallel

      - name: Verify (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -B build-tools -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build-tools --target coinoptest --parallel
          ./build-tools/coinoptest

      - name: Derive version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          if [ "${{ runner.os }}" = "macOS" ]; then
            for bundle in "Coinop" "Coinop Over"; do
              cp -R "build/$bundle.bundle" "out/$bundle.bundle"
              # The registration lives in a file-scope constructor nothing names,
              # so a linker that dropped the translation unit would still produce
              # a loadable bundle that reports it contains no plugins. Check the
              # export, and check the build really is universal -- CMake latches
              # the architecture list at the first target and silently ignores a
              # late change while still reporting success.
              lipo -archs "out/$bundle.bundle/Contents/MacOS/$bundle"
              # Actions runs `shell: bash` as `bash -eo pipefail`, so `cmd | grep -q X`
              # FAILS when grep FINDS its match: grep exits at once, the writer takes
              # SIGPIPE, and pipefail reports the pipeline as failed -- failing the
              # release on a correct binary. It is output-size dependent, so it bites
              # the biggest artefact first. Captured and matched with `case` instead.
              __archs=$( lipo -archs "out/$bundle.bundle/Contents/MacOS/$bundle" )
              case "$__archs" in
                *arm64*) ;;
                *) echo "expected arm64, got: $__archs"; exit 1 ;;
              esac
              __archs=$( lipo -archs "out/$bundle.bundle/Contents/MacOS/$bundle" )
              case "$__archs" in
                *x86_64*) ;;
                *) echo "expected x86_64, got: $__archs"; exit 1 ;;
              esac
              __symbols=$( nm -gU "out/$bundle.bundle/Contents/MacOS/$bundle" )
              case "$__symbols" in
                *_plugMain*) ;;
                *) echo "expected _plugMain, got: $__symbols"; exit 1 ;;
              esac
            done
          else
            cp "build/Release/Coinop.dll" "out/Coinop.dll"
            cp "build/Release/Coinop Over.dll" "out/Coinop Over.dll"
          fi
          ls -R out

      - name: Archive (zip)
        shell: bash
        run: |
          cd out
          if command -v 7z >/dev/null 2>&1; then
            7z a "../coinop-${{ matrix.name }}.zip" ./*
          else
            zip -r "../coinop-${{ matrix.name }}.zip" ./*
          fi

      - name: Disk image (macOS)
        if: runner.os == 'macOS'
        shell: bash
        # A .dmg, but deliberately NOT a .pkg. An FFGL plugin's destination is
        # per-user and edition-specific -- the README installs to
        # ~/Documents/Resolume {Arena,Avenue}/Extra Effects -- so a .pkg would
        # have to guess a path and would silently install to the wrong one for
        # half of users. Mounting an image and dragging the bundles where the
        # README says is the honest shape here.
        run: |
          source scripts/release-lib.sh
          rl_init "Coinop" coinop "${{ steps.ver.outputs.version }}" \
            com.stoatworks.coinop "$GITHUB_WORKSPACE"
          cp README.md out/ 2>/dev/null || true
          rl_adhoc_sign "out/Coinop.bundle"
          rl_adhoc_sign "out/Coinop Over.bundle"
          rl_dmg "${{ matrix.name }}" out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coinop-${{ matrix.name }}
          path: |
            *.zip
            *.dmg
          if-no-files-found: error

  windows-installer:
    name: Windows installer
    needs: build
    runs-on: ubuntu-latest
    # makensis cross-compiles, so the installer is wrapped here from the zip the
    # Windows job uploaded. Its directory page defaults to the common FFGL folder
    # but stays editable, because Resolume reads plugins from a path the user
    # chooses per edition.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Build installer
        shell: bash
        run: |
          source scripts/release-lib.sh
          version="${GITHUB_REF_NAME#v}"
          case "$version" in [0-9]*) ;; *) version="0.0.0" ;; esac
          rl_init "Coinop" coinop "$version" com.stoatworks.coinop "$PWD/installers"
          zip="$(find artifacts -name "coinop-windows-x86_64.zip" | head -1)"
          if [ -z "$zip" ]; then echo "no Windows artefact, nothing to do"; exit 0; fi
          stage="$RUNNER_TEMP/stage-win"
          rm -rf "$stage"; mkdir -p "$stage"
          unzip -q "$zip" -d "$stage"
          cp README.md "$stage/" 2>/dev/null || true
          # --cli: a plugin has no executable to make a shortcut to.
          rl_nsis windows-x86_64 "$stage" --cli
          ls -l installers

      - uses: actions/upload-artifact@v4
        with:
          name: coinop-windows-installer
          path: installers/*
          if-no-files-found: warn

  release:
    name: Publish release
    needs: [build, windows-installer]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
